<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mix Framework — End-to-End Browser Test Runner</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    #topbar {
      padding: 12px 16px;
      background-color: #1e293b;
      border-radius: 8px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #status {
      font-weight: 600;
      color: #38bdf8;
    }
    #frame-container {
      width: 100%;
      height: 700px;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div><strong>⚡ dotMix E2E Verification Matrix</strong></div>
    <div id="status">Initializing runner...</div>
  </div>
  <div id="frame-container">
    <iframe id="test-frame" src="about:blank"></iframe>
  </div>
  <script type="module" src="/runner.js"></script>
</body>
</html>
