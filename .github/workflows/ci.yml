
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24, 26]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Run test suites
        # Each failed test is also reported as an annotation on the run.
        run: npm run test:ci

      - name: Run performance and timing suites
        run: npm run test:perf
        env:
          # Shared 2-core runners are about twice as slow as a developer machine; budgets stay strict locally.
          MIX_PERF_BUDGET_SCALE: "2"

      - name: Enforce bundle size budgets
        run: node tools/release/measure-size.mjs --check
