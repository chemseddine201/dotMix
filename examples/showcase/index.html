<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mix / Tix Framework — Interactive Showcase (v1.0.0-rc.1)</title>
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #11111b;
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }
  </style>

  <!-- Scoped Component Styles -->
  <link rel="stylesheet" href="./dist/bundle.css">

  <!-- Native Browser Import Map -->
  <script type="importmap">
  {
    "imports": {
      "@mix/runtime": "/packages/runtime/dist/index.js",
      "@mix/router": "/packages/router/dist/index.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div style="padding: 40px; text-align: center; color: #a6adc8; font-family: monospace;">
      Loading Mix / Tix Runtime and Showcase Components...
    </div>
  </div>

  <script type="module" src="./dist/main.js"></script>
</body>
</html>
