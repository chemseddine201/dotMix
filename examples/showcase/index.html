<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mix / Tix Framework — All-In-One Enterprise Architecture</title>
  <script type="importmap">
    {
      "imports": {
        "@mix/runtime": "/runtime/index.js",
        "@mix/router": "/router/index.js"
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px 16px 60px;
      background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .demo-topbar {
      max-width: 1040px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 14px;
      background-color: #0f172a;
      color: #f8fafc;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.15);
    }
    .demo-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }
    .demo-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
    }
    .demo-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .demo-switcher button {
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .demo-switcher button:hover {
      background-color: #334155;
      color: #ffffff;
    }
    .demo-switcher button.active {
      background-color: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }
    #app {
      max-width: 1040px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="demo-topbar">
    <div class="demo-brand">
      <span>⚡ Mix / Tix Compiler-Native UI</span>
      <span class="demo-pill">Zero Virtual DOM · Surgical DOM</span>
    </div>
    <div class="demo-switcher">
      <button id="btn-view-master" class="active">🌟 MasterApp.mix (All-In-One)</button>
      <button id="btn-view-workspace">StatefulWorkspace.mix</button>
      <button id="btn-view-app">App.mix + TypeSafeCard.tix</button>
    </div>
  </div>

  <div id="app"></div>

  <script type="module">
    import { mount, setSanitizerProvider } from "/runtime/index.js";
    import MasterApp from "/dist/MasterApp.mix.js";
    import StatefulWorkspace from "/dist/StatefulWorkspace.mix.js";
    import App from "/dist/App.mix.js";

    // Configure root HTML Sanitizer Authority (D-109 / HAA-03)
    setSanitizerProvider({
      sanitizeHtml(untrustedHtml) {
        return untrustedHtml.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, "");
      }
    });

    const container = document.getElementById("app");
    const btnMaster = document.getElementById("btn-view-master");
    const btnWorkspace = document.getElementById("btn-view-workspace");
    const btnApp = document.getElementById("btn-view-app");

    let currentHandle = null;

    function renderComponent(Comp, activeBtn) {
      if (currentHandle) currentHandle.unmount();
      container.innerHTML = "";
      [btnMaster, btnWorkspace, btnApp].forEach(b => b.classList.remove("active"));
      activeBtn.classList.add("active");
      currentHandle = mount(Comp, container);
    }

    btnMaster.addEventListener("click", () => renderComponent(MasterApp, btnMaster));
    btnWorkspace.addEventListener("click", () => renderComponent(StatefulWorkspace, btnWorkspace));
    btnApp.addEventListener("click", () => renderComponent(App, btnApp));

    // Mount MasterApp by default
    renderComponent(MasterApp, btnMaster);
  </script>
</body>
</html>
