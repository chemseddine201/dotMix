<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mix/Tix Framework — Live Stateful Showcase</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px 16px 60px;
      background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .demo-topbar {
      max-width: 880px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-radius: 12px;
      background-color: #0f172a;
      color: #f8fafc;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.15);
    }
    .demo-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }
    .demo-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
    }
    .demo-switcher {
      display: flex;
      gap: 8px;
    }
    .demo-switcher button {
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
    }
    .demo-switcher button.active {
      background-color: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="demo-topbar">
    <div class="demo-brand">
      <span>⚡ Mix / Tix Compiler-Native UI</span>
      <span class="demo-pill">Zero Virtual DOM · Surgical DOM</span>
    </div>
    <div class="demo-switcher">
      <button id="btn-view-workspace" class="active">StatefulWorkspace.mix + MetricCard.tix</button>
      <button id="btn-view-app">App.mix + TypeSafeCard.tix</button>
    </div>
  </div>

  <div id="app"></div>

  <script type="module">
    import { mount, setSanitizerProvider } from "/runtime/index.js";
    import StatefulWorkspace from "/dist/StatefulWorkspace.mix.js";
    import App from "/dist/App.mix.js";

    // Configure root HTML Sanitizer Authority (D-109 / HAA-03)
    setSanitizerProvider({
      sanitizeHtml(untrustedHtml) {
        return untrustedHtml.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, "");
      }
    });

    const container = document.getElementById("app");
    const btnWorkspace = document.getElementById("btn-view-workspace");
    const btnApp = document.getElementById("btn-view-app");

    let currentHandle = mount(StatefulWorkspace, container);

    btnWorkspace.addEventListener("click", () => {
      if (currentHandle) currentHandle.unmount();
      btnWorkspace.classList.add("active");
      btnApp.classList.remove("active");
      currentHandle = mount(StatefulWorkspace, container);
    });

    btnApp.addEventListener("click", () => {
      if (currentHandle) currentHandle.unmount();
      btnApp.classList.add("active");
      btnWorkspace.classList.remove("active");
      currentHandle = mount(App, container);
    });
  </script>
</body>
</html>
